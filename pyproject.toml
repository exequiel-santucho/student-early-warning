[project]
name = "student-early-warning"
version = "0.1.0"
description = "Early-warning model for students at risk of failing or withdrawing (OULAD)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.148.0",
    "numpy==2.3.3",
    "pydantic>=2.14.1",
    "scikit-learn==1.7.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "pandas==2.3.2",
    "pytest>=9.1.1",
    "seaborn>=0.13.2",
    "xgboost==3.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
