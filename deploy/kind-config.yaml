# Local cluster for testing the deployment:
#   kind create cluster --name early-warning --config deploy/kind-config.yaml
# On slow machines (e.g. Docker Desktop on Windows) the control plane can take more
# than the default 4 minutes to become healthy, so the timeout is raised to 10 minutes.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.33.1
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        timeouts:
          controlPlaneComponentHealthCheck: 10m0s
