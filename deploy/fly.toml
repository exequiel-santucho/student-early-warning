# fly launch --copy-config --config deploy/fly.toml --dockerfile Dockerfile
app = "student-early-warning"
primary_region = "gru"

[build]
  dockerfile = "../Dockerfile"

[http_service]
  internal_port = 9696
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  method = "GET"
  path = "/health"
  interval = "30s"
  timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
